# Builds the Expo web version and publishes it on GitHub Pages (free for public repos).
# One-time setup: Repository -> Settings -> Pages -> Source: "GitHub Actions".
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_BASE_URL: /react-native-lingua
      # GitHub Pages shows 404.html for unknown paths; reuse the app shell
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
